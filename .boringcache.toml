workspace = "boringcache/benchmark-posthog"

[adapters.docker]
tag = "posthog-docker-local"
metadata-hints = ["benchmark=posthog", "upstream-job=build-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--platform", "linux/amd64",
  "--provenance", "false",
  "--tag", "posthog-benchmark:local",
  "upstream",
]

[adapters.turbo]
tag = "posthog-turbo-local"
