name: "Canary Benchmark"
run-name: ${{ format('Canary | CLI {0} | BuildKit {1}', inputs.cli_version || 'latest immutable', inputs.buildkit_image) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Exact BoringCache CLI release tag. Empty selects the newest immutable CLI canary."
        required: false
        type: string
        default: ""
      buildkit_image:
        description: "BoringCache BuildKit image to test."
        required: true
        type: string
        default: ghcr.io/boringcache/buildkit:canary
      mountcache_probe:
        description: "Exercise PostHog's existing pnpm and uv cache mounts through the CLI-owned archive worker."
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Run PostHog canary
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated fresh benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ inputs.cli_version }}
          BUILDKIT_IMAGE: ${{ inputs.buildkit_image }}
          MOUNTCACHE_PROBE: ${{ inputs.mountcache_probe }}
        run: |
          set -euo pipefail

          if [[ -z "$CLI_VERSION" ]]; then
            CLI_VERSION="$(gh release list --repo boringcache/cli --limit 100 --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("vcli-canary-"))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
          fi
          if [[ -z "$CLI_VERSION" || "$CLI_VERSION" == "null" ]]; then
            echo "::error::No immutable BoringCache CLI canary release was found."
            exit 1
          fi

          dispatch_args=(
            -f "cli_version=${CLI_VERSION}"
            -f "buildkit_image=${BUILDKIT_IMAGE}"
            -f benchmark_id_suffix=-canary
          )
          if [[ "$MOUNTCACHE_PROBE" == "true" ]]; then
            dispatch_args+=(
              -f lane_filter=boringcache
              -f mountcache_probe=true
            )
          fi
          RUN_URL="$(gh workflow run posthog-fresh-benchmark.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            "${dispatch_args[@]}")"
          RUN_ID="${RUN_URL##*/}"
          echo "Canary benchmark: ${RUN_URL}"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
