name: "PostHog Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional amd64 or multi-platform managed BuildKit image."
        required: false
        type: string
        default: ""
      buildkit_image_arm64:
        description: "Optional arm64 managed BuildKit image override."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
      upstream_ref:
        description: "Optional PostHog ref or SHA instead of the pinned submodule commit."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/workflows/posthog-benchmark.yml"
      - ".github/workflows/posthog-fresh-benchmark.yml"
      - ".github/workflows/reusable-posthog-docker-benchmark.yml"
      - "README.md"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GHA / amd64
            strategy: actions-cache
            benchmark_id: posthog
            runner_label: ubuntu-latest-8-cores
            platform: linux/amd64
            docker_tool_cache: false
            mountcache: false
            no_cache: false
            run_on_pull_request: true
          - name: BC / amd64
            strategy: boringcache
            benchmark_id: posthog
            runner_label: ubuntu-latest-8-cores
            platform: linux/amd64
            docker_tool_cache: false
            mountcache: false
            no_cache: false
            run_on_pull_request: true
          - name: BC + Turbo / amd64
            strategy: boringcache
            benchmark_id: posthog-toolcache
            runner_label: ubuntu-latest-8-cores
            platform: linux/amd64
            docker_tool_cache: true
            mountcache: false
            no_cache: false
            run_on_pull_request: true
          - name: BC + mount cache / amd64
            strategy: boringcache
            benchmark_id: posthog-mountcache
            runner_label: ubuntu-latest-8-cores
            platform: linux/amd64
            docker_tool_cache: false
            mountcache: true
            no_cache: true
            run_on_pull_request: false
          - name: BC / arm64
            strategy: boringcache
            benchmark_id: posthog
            runner_label: ubuntu-24.04-arm
            platform: linux/arm64
            docker_tool_cache: false
            mountcache: false
            no_cache: false
            run_on_pull_request: false
    uses: ./.github/workflows/reusable-posthog-docker-benchmark.yml
    with:
      enabled: ${{ github.event_name != 'pull_request' || matrix.run_on_pull_request }}
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      runner_label: ${{ matrix.runner_label }}
      platform: ${{ matrix.platform }}
      docker_tool_cache: ${{ matrix.docker_tool_cache }}
      mountcache: ${{ matrix.mountcache }}
      no_cache: ${{ matrix.no_cache }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ matrix.platform == 'linux/arm64' && (inputs.buildkit_image_arm64 || inputs.buildkit_image) || inputs.buildkit_image }}
      upstream_ref: ${{ inputs.upstream_ref }}
    secrets: inherit
