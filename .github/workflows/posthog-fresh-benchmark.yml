name: "PostHog Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GHA / amd64
            strategy: actions-cache
          - name: BC / amd64
            strategy: boringcache
    uses: ./.github/workflows/reusable-posthog-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: fresh
      benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
      runner_label: ubuntu-latest-8-cores
      platform: linux/amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
