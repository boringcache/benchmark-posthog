name: "PostHog Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
      runner_label:
        description: "Optional runner label for a manual main-branch experiment."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 3"
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/actions/posthog-docker-benchmark/**"
      - ".github/workflows/posthog-benchmark.yml"
      - ".github/workflows/posthog-fresh-benchmark.yml"
      - "README.md"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"

jobs:
  gha-cold:
    name: GitHub Actions amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    outputs:
      cache_scope: ${{ steps.benchmark.outputs.cache_scope }}
    steps:
      - uses: actions/checkout@v6
      - id: benchmark
        uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: actions-cache
          phase: publish
          cache_lane: fresh
          benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64

  gha-warm:
    name: GitHub Actions amd64 warm
    needs: gha-cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: actions-cache
          phase: warm
          cache_lane: fresh
          benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64
          cache_scope: ${{ needs.gha-cold.outputs.cache_scope }}

  boringcache-cold:
    name: BoringCache amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    outputs:
      cache_scope: ${{ steps.benchmark.outputs.cache_scope }}
    steps:
      - uses: actions/checkout@v6
      - id: benchmark
        uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: boringcache
          phase: publish
          cache_lane: fresh
          benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  boringcache-warm:
    name: BoringCache amd64 warm
    needs: boringcache-cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: boringcache
          phase: warm
          cache_lane: fresh
          benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}
          cache_scope: ${{ needs.boringcache-cold.outputs.cache_scope }}

  boringcache-turbo-cold:
    name: BoringCache Turbo amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    outputs:
      cache_scope: ${{ steps.benchmark.outputs.cache_scope }}
    steps:
      - uses: actions/checkout@v6
      - id: benchmark
        uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: boringcache
          phase: publish
          cache_lane: fresh
          benchmark_id: ${{ format('posthog-toolcache{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64
          docker_tool_cache: "true"
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  boringcache-turbo-warm:
    name: BoringCache Turbo amd64 warm
    needs: boringcache-turbo-cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/posthog-docker-benchmark
        with:
          strategy: boringcache
          phase: warm
          cache_lane: fresh
          benchmark_id: ${{ format('posthog-toolcache{0}', inputs.benchmark_id_suffix) }}
          platform: linux/amd64
          docker_tool_cache: "true"
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}
          cache_scope: ${{ needs.boringcache-turbo-cold.outputs.cache_scope }}
