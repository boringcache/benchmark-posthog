name: "PostHog Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', startsWith(inputs.cli_version, 'vcli-canary-') && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image for canary runs."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Exact BoringCache CLI release tag; immutable canary tags are also accepted."
        required: false
        type: string
        default: "v1.15.0"
      benchmark_id_suffix:
        description: "Optional suffix appended to built-in benchmark/cache scopes for isolated comparison runs."
        required: false
        type: string
        default: ""
      lane_filter:
        description: "Run both comparison lanes or only the BoringCache product lane."
        required: false
        type: choice
        default: all
        options:
          - all
          - boringcache
      mountcache_probe:
        description: "Exercise PostHog's existing pnpm and uv cache mounts through the CLI-owned archive worker."
        required: false
        type: boolean
        default: false
      runner_label:
        description: "Optional native runner label override. It must match the selected platform; empty uses the benchmark defaults."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA amd64
    if: ${{ inputs.lane_filter != 'boringcache' }}
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      project_repo: PostHog/posthog
      dockerfile_path: upstream/Dockerfile
      docker_context: upstream
      image_tag: posthog-benchmark:latest
      docker_platform: linux/amd64
      cli_platform: linux-amd64
      benchmark_workspace: ${{ github.repository }}
      free_disk_space: true
    secrets: inherit

  boringcache:
    name: BoringCache amd64
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      benchmark_id: ${{ format('posthog{0}', inputs.benchmark_id_suffix) }}
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      project_repo: PostHog/posthog
      dockerfile_path: upstream/Dockerfile
      docker_context: upstream
      image_tag: posthog-benchmark:latest
      docker_platform: linux/amd64
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image || 'ghcr.io/boringcache/buildkit:v0.30.0-bc' }}
      buildkit_mountcache_offloader: ${{ inputs.mountcache_probe }}
      warm_docker_build_args: |-
        ${{ inputs.mountcache_probe && '--no-cache-filter' || '' }}
        ${{ inputs.mountcache_probe && 'frontend-build' || '' }}
        ${{ inputs.mountcache_probe && '--no-cache-filter' || '' }}
        ${{ inputs.mountcache_probe && 'node-scripts-build' || '' }}
        ${{ inputs.mountcache_probe && '--no-cache-filter' || '' }}
        ${{ inputs.mountcache_probe && 'posthog-build' || '' }}
      benchmark_workspace: ${{ github.repository }}
      free_disk_space: true
    secrets: inherit
